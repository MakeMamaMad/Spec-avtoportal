name: External Promotion Queue

on:
  workflow_dispatch:
  schedule:
    # 10:15 Moscow time
    - cron: '15 7 * * *'

permissions:
  contents: write

concurrency:
  group: external-promotion
  cancel-in-progress: false

jobs:
  build-queue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build external promotion queue
        env:
          PROMOTION_MAX_ITEMS: "3"
        run: |
          python promotion/agent.py

      - name: Commit queue
        run: |
          git config user.name "specavto-promotion"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/data/promotion_queue.json
          if git diff --cached --quiet; then
            echo "No promotion queue changes"
            exit 0
          fi
          git commit -m "promotion: refresh external placement queue"
          git push origin main
