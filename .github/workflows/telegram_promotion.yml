name: Promotion — Telegram Outreach

on:
  workflow_dispatch:
  schedule:
    # 13:15 Moscow time
    - cron: '15 10 * * *'
  push:
    branches: [ main ]
    paths:
      - 'promotion/telegram_targets.json'
      - 'promotion/build_telegram_promo.py'
      - 'promotion/outreach_telegram_ad_bots.py'
      - 'promotion/core/telegram_failover.py'
      - 'promotion/core/manual_queue.py'
      - 'promotion/publish_telegram_approved.py'
      - '.github/workflows/telegram_promotion.yml'

permissions:
  contents: write

concurrency:
  group: external-telegram-promotion
  cancel-in-progress: false

jobs:
  telegram-promotion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build external Telegram promotion queue
        run: |
          python promotion/build_telegram_promo.py

      - name: Contact one public Telegram advertising bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python promotion/outreach_telegram_ad_bots.py

      - name: Publish only to explicitly approved external channels
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python promotion/publish_telegram_approved.py

      - name: Commit promotion state
        if: always()
        run: |
          git config user.name "specavto-promotion"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/data/telegram_promo_queue.json frontend/data/telegram_promo_history.json frontend/data/promotion/manual_queue.json frontend/data/promotion/telegram_outreach_summary.json || true
          if git diff --cached --quiet; then
            echo "No Telegram promotion state changes"
            exit 0
          fi
          git commit -m "promotion: refresh external Telegram campaign"
          git pull --rebase origin main
          git push origin main
