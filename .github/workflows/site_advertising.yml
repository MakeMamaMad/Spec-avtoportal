name: Daily Site Advertising

on:
  workflow_dispatch:
  schedule:
    # 10:15 Moscow time (UTC+3): exactly one new catalog attempt per day.
    - cron: '15 7 * * *'

permissions:
  contents: write

concurrency:
  group: daily-site-advertising
  cancel-in-progress: false

jobs:
  advertise-one-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build site-promotion queue
        run: |
          python promotion/build_site_promo.py

      - name: Select exactly one catalog for today
        id: select
        shell: bash
        run: |
          TARGET_ID="$(python promotion/select_daily_catalog.py)"
          echo "target_id=$TARGET_ID" >> "$GITHUB_OUTPUT"
          echo "Selected target: $TARGET_ID"

      - name: Install browser automation
        if: steps.select.outputs.target_id != 'none'
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Submit SpecAvtoPortal to today's catalog
        if: steps.select.outputs.target_id != 'none'
        env:
          PROMOTION_CONTACT_EMAIL: ${{ secrets.PROMOTION_CONTACT_EMAIL }}
          DAILY_TARGET_ID: ${{ steps.select.outputs.target_id }}
        run: |
          python promotion/submit_generic_directory.py --target "$DAILY_TARGET_ID"

      - name: Daily limit already used or queue empty
        if: steps.select.outputs.target_id == 'none'
        run: |
          echo "No external submission today: either today's one-catalog limit is already used or there are no unused active targets."

      - name: Commit promotion state
        if: always()
        run: |
          git config user.name "specavto-promotion"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/data/site_promo_queue.json frontend/data/site_promo_history.json frontend/data/daily_catalog_target.json || true
          if git diff --cached --quiet; then
            echo "No site-promotion state changes"
            exit 0
          fi
          git commit -m "promotion: daily catalog attempt"
          git pull --rebase origin main
          git push origin main
