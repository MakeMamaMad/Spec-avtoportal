name: Site Advertising

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'promotion/site_campaign.json'
      - 'promotion/site_targets.json'
      - 'promotion/build_site_promo.py'
      - 'promotion/submit_popcat.py'
      - '.github/workflows/site_advertising.yml'

permissions:
  contents: write

concurrency:
  group: site-advertising
  cancel-in-progress: false

jobs:
  advertise-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build site-promotion queue
        run: |
          python promotion/build_site_promo.py

      - name: Install browser automation
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Submit SpecAvtoPortal to PopCat
        env:
          PROMOTION_CONTACT_EMAIL: ${{ secrets.PROMOTION_CONTACT_EMAIL }}
        run: |
          python promotion/submit_popcat.py

      - name: Commit site-promotion state
        run: |
          git config user.name "specavto-promotion"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/data/site_promo_queue.json frontend/data/site_promo_history.json || true
          if git diff --cached --quiet; then
            echo "No site-promotion state changes"
            exit 0
          fi
          git commit -m "promotion: update site advertising state"
          git push origin main
