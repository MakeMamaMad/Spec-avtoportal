name: Promotion — Daily Site Advertising

on:
  workflow_dispatch:
  schedule:
    # 10:15 Moscow time (UTC+3): keep trying unused automatic catalogs until one succeeds.
    - cron: '15 7 * * *'
  push:
    branches: [ main ]
    paths:
      - 'promotion/run_catalog_campaign.py'
      - 'promotion/submit_generic_directory.py'
      - 'promotion/site_targets.json'
      - '.github/workflows/site_advertising.yml'

permissions:
  contents: write

concurrency:
  group: daily-site-advertising
  cancel-in-progress: false

jobs:
  advertise-until-success:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build site-promotion queue
        run: |
          python promotion/build_site_promo.py

      - name: Install browser automation
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Try catalogs until one submission succeeds
        env:
          PROMOTION_CONTACT_EMAIL: ${{ secrets.PROMOTION_CONTACT_EMAIL }}
          CATALOG_MAX_ATTEMPTS_PER_RUN: "20"
        run: |
          python promotion/run_catalog_campaign.py

      - name: Commit promotion state
        if: always()
        run: |
          git config user.name "specavto-promotion"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/data/site_promo_queue.json frontend/data/site_promo_history.json frontend/data/daily_catalog_target.json || true
          if git diff --cached --quiet; then
            echo "No site-promotion state changes"
            exit 0
          fi
          git commit -m "promotion: catalog failover run"
          git pull --rebase origin main
          git push origin main
