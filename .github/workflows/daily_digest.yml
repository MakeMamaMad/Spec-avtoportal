name: Telegram — Editorial Digest

on:
  workflow_dispatch:
  schedule:
    # 09:30 and 19:30 Moscow time (UTC+3)
    - cron: '30 6 * * *'
    - cron: '30 16 * * *'

permissions:
  contents: write

concurrency:
  group: telegram-publisher
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: aggregator/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r aggregator/requirements.txt

      - name: Publish editorial digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NEWS_JSON_PATH: "frontend/data/news.json"
          SITE_URL: "https://spec-avtoportal.ru/"
        run: |
          python tools/daily_digest/agent.py

      - name: Commit Telegram state
        run: |
          git config user.name "specavto-telegram"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/data/telegram_state.json || true
          if git diff --cached --quiet; then
            echo "No Telegram state changes"
            exit 0
          fi
          git commit -m "telegram: update editorial digest state"
          git push origin main
