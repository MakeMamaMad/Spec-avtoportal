name: QA

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ redesign-v1, main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python syntax
        run: |
          python -m py_compile tools/build_seo.py aggregator/main.py aggregator/post_to_telegram.py

      - name: JavaScript syntax
        run: |
          node --check frontend/news.js
          node --check frontend/article.js

      - name: Build SEO pages
        run: |
          python tools/build_seo.py

      - name: Validate generated SEO output
        run: |
          python - <<'PY'
          import json
          import pathlib
          import re
          import xml.etree.ElementTree as ET

          root = pathlib.Path("frontend")
          items = json.loads((root / "data/news.json").read_text("utf-8"))
          assert isinstance(items, list) and items, "news.json must be a non-empty list"

          ids = [str(x.get("id") or "") for x in items]
          slugs = [str(x.get("slug") or "") for x in items]
          assert all(ids), "every item must have id"
          assert all(slugs), "every item must have slug"
          assert len(ids) == len(set(ids)), "ids must be unique"
          assert len(slugs) == len(set(slugs)), "slugs must be unique"

          pages = list((root / "news").glob("*/index.html"))
          assert len(pages) == len(items), f"expected {len(items)} article pages, got {len(pages)}"

          sample = pages[0].read_text("utf-8")
          for marker in ('rel="canonical"', 'application/ld+json', 'property="og:title"', 'name="description"'):
              assert marker in sample, f"missing SEO marker: {marker}"

          regulations_data = json.loads((root / "data/regulations.json").read_text("utf-8"))
          regulation_items = regulations_data.get("items", [])
          assert regulation_items, "regulations catalog must not be empty"
          regulation_slugs = [str(x.get("slug") or "") for x in regulation_items]
          assert all(regulation_slugs), "every active regulation must have slug"
          assert len(regulation_slugs) == len(set(regulation_slugs)), "regulation slugs must be unique"
          assert all(str(x.get("status") or "") == "Действует" for x in regulation_items), "public regulations must be active"
          assert all("example.com" not in str(x.get("official_url") or "") for x in regulation_items), "test regulation URLs are forbidden"
          assert all(str(x.get("official_url") or "").startswith("https://") for x in regulation_items), "every regulation needs an HTTPS official URL"
          assert regulations_data.get("verified_at"), "regulations need verified_at"

          regulations_dir = root / "regulations"
          regulation_pages = list(regulations_dir.glob("*/index.html"))
          assert len(regulation_pages) == len(regulation_items), f"expected {len(regulation_items)} regulation pages, got {len(regulation_pages)}"
          for page in regulation_pages:
              regulation_html = page.read_text("utf-8")
              for marker in ('rel="canonical"', 'application/ld+json', 'name="description"', 'Открыть официальный документ'):
                  assert marker in regulation_html, f"regulation page missing marker {marker}: {page}"

          law_html = (root / "law.html").read_text("utf-8")
          for marker in ('rel="canonical"', 'application/ld+json', 'Последняя проверка редакцией'):
              assert marker in law_html, f"law catalog missing marker: {marker}"

          knowledge = root / "knowledge.html"
          assert knowledge.exists(), "knowledge.html missing"
          knowledge_html = knowledge.read_text("utf-8")
          for marker in ('rel="canonical"', 'name="description"', 'База знаний'):
              assert marker in knowledge_html, f"knowledge page missing marker: {marker}"

          video_html = (root / "video.html").read_text("utf-8")
          assert 'noindex,follow' in video_html, "video page must be noindex"
          assert '/knowledge.html' in video_html, "video page must point to knowledge base"

          sitemap = root / "sitemap.xml"
          robots = root / "robots.txt"
          assert sitemap.exists(), "sitemap.xml not generated"
          assert robots.exists(), "robots.txt not generated"
          ET.parse(sitemap)
          robots_text = robots.read_text("utf-8")
          assert "Sitemap: https://spec-avtoportal.ru/sitemap.xml" in robots_text

          topic_slugs = [
              "rynok-i-proizvodstvo",
              "gruzovaya-tehnika",
              "pritsepnaya-tehnika",
              "sobytiya-otrasli",
              "novye-tehnologii",
              "tamozhnya-i-logistika",
          ]
          for slug in topic_slugs:
              topic_page = root / "topics" / slug / "index.html"
              assert topic_page.exists(), f"topic page not generated: {slug}"
              topic_html = topic_page.read_text("utf-8")
              for marker in ('rel="canonical"', 'application/ld+json', 'name="description"'):
                  assert marker in topic_html, f"topic {slug} missing SEO marker: {marker}"

          brand_slugs = [
              "satpricep",
              "krone",
              "maz",
              "kamaz",
              "kogel",
              "mercedes-benz-trucks",
              "schmitz-cargobull",
              "saf-holland",
              "bpw",
          ]
          brand_directory = root / "brands" / "index.html"
          assert brand_directory.exists(), "brand directory not generated"
          directory_html = brand_directory.read_text("utf-8")
          for marker in ('rel="canonical"', 'application/ld+json', 'name="description"'):
              assert marker in directory_html, f"brand directory missing SEO marker: {marker}"

          for slug in brand_slugs:
              brand_page = root / "brands" / slug / "index.html"
              assert brand_page.exists(), f"brand page not generated: {slug}"
              brand_html = brand_page.read_text("utf-8")
              for marker in ('rel="canonical"', 'application/ld+json', 'name="description"'):
                  assert marker in brand_html, f"brand {slug} missing SEO marker: {marker}"

          urls = re.findall(r"<loc>(.*?)</loc>", sitemap.read_text("utf-8"))
          assert len(urls) >= len(items) + len(topic_slugs) + len(brand_slugs) + 1, "sitemap missing article/topic/brand URLs"
          for slug in topic_slugs:
              assert f"https://spec-avtoportal.ru/topics/{slug}/" in urls, f"topic missing from sitemap: {slug}"
          assert "https://spec-avtoportal.ru/knowledge.html" in urls, "knowledge base missing from sitemap"
          assert "https://spec-avtoportal.ru/video.html" not in urls, "video archive must not be in sitemap"
          for slug in regulation_slugs:
              assert f"https://spec-avtoportal.ru/regulations/{slug}/" in urls, f"regulation missing from sitemap: {slug}"
          assert "https://spec-avtoportal.ru/brands/" in urls, "brand directory missing from sitemap"
          for slug in brand_slugs:
              assert f"https://spec-avtoportal.ru/brands/{slug}/" in urls, f"brand missing from sitemap: {slug}"

          print(f"QA OK: {len(items)} items, {len(pages)} pages, {len(topic_slugs)} topic hubs, {len(brand_slugs)} brand hubs, {len(regulation_items)} regulations, {len(urls)} sitemap URLs")
          PY
