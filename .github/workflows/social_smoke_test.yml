name: Social Channels Smoke Test

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/social_smoke_test.py'
      - '.github/workflows/social_smoke_test.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install smoke deps
        run: |
          python -m pip install --upgrade pip
          pip install requests Pillow

      - name: Compile smoke test
        run: |
          python -m py_compile tools/social_smoke_test.py aggregator/post_to_telegram.py aggregator/post_to_vk.py aggregator/telegram_visual.py

      - name: Publish one-time channel check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
        run: |
          python tools/social_smoke_test.py
