name: Diagnostics — 123ru Form

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/123ru_form_diag.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Inspect form
        run: |
          python - <<'PY'
          import json
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(locale="ru-RU")
              page.goto("https://123ru.net/other/addnews/", wait_until="domcontentloaded", timeout=60000)

              rows=[]
              loc=page.locator("input,textarea,select")
              for i in range(min(loc.count(),160)):
                  f=loc.nth(i)
                  try:
                      row={
                          "tag":f.evaluate("(el)=>el.tagName.toLowerCase()"),
                          "type":f.get_attribute("type") or "",
                          "name":f.get_attribute("name") or "",
                          "id":f.get_attribute("id") or "",
                          "placeholder":f.get_attribute("placeholder") or "",
                          "required":f.get_attribute("required") is not None,
                      }
                      if row["tag"]=="select":
                          opts=[]
                          options=f.locator("option")
                          for j in range(min(options.count(),120)):
                              o=options.nth(j)
                              opts.append({
                                  "value":o.get_attribute("value") or "",
                                  "text":(o.inner_text() or "").strip(),
                              })
                          row["options"]=opts
                      rows.append(row)
                  except Exception:
                      pass

              print("RU123_FIELDS="+json.dumps(rows,ensure_ascii=False))
              body=(page.locator("body").inner_text() or "")
              print("RU123_TEXT="+json.dumps(body[body.find("Правка новости"):body.find("Правка новости")+3500],ensure_ascii=False))
              captcha=(
                  page.locator('iframe[src*="captcha" i], .g-recaptcha, [class*="captcha" i], [id*="captcha" i], img[src*="captcha" i]').count()
                  or "код с картинки" in body.lower()
                  or "я не робот" in body.lower()
              )
              print("RU123_CAPTCHA="+("yes" if captcha else "no"))

              page.goto("https://123ru.net/kazan/", wait_until="domcontentloaded", timeout=60000)
              add_links=[]
              anchors=page.locator("a")
              for i in range(min(anchors.count(),500)):
                  a=anchors.nth(i)
                  try:
                      txt=(a.inner_text() or "").strip()
                      href=a.get_attribute("href") or ""
                      if "добав" in txt.lower() and "новост" in txt.lower():
                          add_links.append({"text":txt,"href":href})
                  except Exception:
                      pass
              print("RU123_KAZAN_ADD_LINKS="+json.dumps(add_links,ensure_ascii=False))

              page.goto("https://123ru.net/other/addnews/", wait_until="domcontentloaded", timeout=60000)
              country=page.locator('select[name="countryid"]')
              region=page.locator('select[name="regionid"]')
              city=page.locator('select[name="cityid"]')
              country.select_option("1")
              page.wait_for_timeout(1200)
              regions=[]
              for i in range(region.locator("option").count()):
                  o=region.locator("option").nth(i)
                  regions.append({"value":o.get_attribute("value") or "","text":(o.inner_text() or "").strip()})
              print("RU123_RUSSIA_REGIONS="+json.dumps(regions,ensure_ascii=False))

              tat=None
              for row in regions:
                  if "татар" in row["text"].lower():
                      tat=row["value"]
                      break
              if tat:
                  region.select_option(tat)
                  page.wait_for_timeout(1200)
                  cities=[]
                  for i in range(city.locator("option").count()):
                      o=city.locator("option").nth(i)
                      cities.append({"value":o.get_attribute("value") or "","text":(o.inner_text() or "").strip()})
                  print("RU123_TATARSTAN_CITIES="+json.dumps(cities,ensure_ascii=False))
              browser.close()
          PY
