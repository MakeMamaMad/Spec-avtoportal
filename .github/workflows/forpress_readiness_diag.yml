name: Diagnostics — ForPress Readiness

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/forpress_readiness_diag.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Inspect ForPress
        env:
          FORPRESS_LOGIN: ${{ secrets.FORPRESS_LOGIN }}
          FORPRESS_PASSWORD: ${{ secrets.FORPRESS_PASSWORD }}
        run: |
          python - <<'PY'
          import json, os
          from playwright.sync_api import sync_playwright

          login=os.environ.get("FORPRESS_LOGIN","").strip()
          password=os.environ.get("FORPRESS_PASSWORD","").strip()
          print("FORPRESS_CREDENTIALS="+("present" if login and password else "missing"))

          def inv(page):
              out=[]
              loc=page.locator("input,textarea,select")
              for i in range(min(loc.count(),120)):
                  f=loc.nth(i)
                  try:
                      out.append({
                          "tag":f.evaluate("(el)=>el.tagName.toLowerCase()"),
                          "type":f.get_attribute("type") or "",
                          "name":f.get_attribute("name") or "",
                          "id":f.get_attribute("id") or "",
                          "placeholder":f.get_attribute("placeholder") or "",
                          "required":f.get_attribute("required") is not None,
                      })
                  except Exception:
                      pass
              return out

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(locale="ru-RU")

              page.goto("https://forpress.ru/register", wait_until="domcontentloaded", timeout=60000)
              print("FORPRESS_REGISTER_URL="+page.url)
              print("FORPRESS_REGISTER_FIELDS="+json.dumps(inv(page),ensure_ascii=False))
              body=(page.locator("body").inner_text() or "")
              print("FORPRESS_REGISTER_TEXT="+json.dumps(body[:2500],ensure_ascii=False))
              captcha=(
                  page.locator('iframe[src*="captcha" i], .g-recaptcha, [class*="captcha" i], [id*="captcha" i]').count()
                  or "капча" in body.lower()
                  or "я не робот" in body.lower()
              )
              print("FORPRESS_REGISTER_CAPTCHA="+("yes" if captcha else "no"))

              page.goto("https://forpress.ru/profile/release/create", wait_until="domcontentloaded", timeout=60000)
              print("FORPRESS_ADD_ANON_URL="+page.url)
              print("FORPRESS_ADD_ANON_FIELDS="+json.dumps(inv(page),ensure_ascii=False))

              if login and password:
                  page.goto("https://forpress.ru/login", wait_until="domcontentloaded", timeout=60000)
                  fields=inv(page)
                  print("FORPRESS_LOGIN_FIELDS="+json.dumps(fields,ensure_ascii=False))
                  user=page.locator('input[type="email"],input[name*="email" i],input[name*="login" i],input[type="text"]')
                  pwd=page.locator('input[type="password"]')
                  if user.count() and pwd.count():
                      user.first.fill(login)
                      pwd.first.fill(password)
                      submit=page.locator('button[type="submit"],input[type="submit"]')
                      if submit.count():
                          submit.first.click()
                          try: page.wait_for_load_state("domcontentloaded", timeout=30000)
                          except Exception: pass
                          page.wait_for_timeout(800)
                  page.goto("https://forpress.ru/profile/release/create", wait_until="domcontentloaded", timeout=60000)
                  print("FORPRESS_ADD_AUTH_URL="+page.url)
                  print("FORPRESS_ADD_AUTH_FIELDS="+json.dumps(inv(page),ensure_ascii=False))
              browser.close()
          PY
