name: First YouTube Short v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/youtube_first_short_smoke.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/autoposter/requirements.txt

      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install deps
        run: |
          pip install -r tools/autoposter/requirements.txt

      - name: Restore YouTube token
        env:
          YT_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
        run: |
          cd tools/autoposter
          test -n "$YT_TOKEN_B64" || (echo "YOUTUBE_TOKEN_B64 missing" && exit 1)
          printf "%s" "$YT_TOKEN_B64" | base64 -d > youtube_token.json

      - name: Generate first AI Short v2
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_SCRIPT: "1"
          AI_IMAGES: "1"
          OPENAI_TEXT_MODEL: "gpt-5.6-luna"
          OPENAI_IMAGE_MODEL: "gpt-image-2.5-sunburst"
          OPENAI_IMAGE_QUALITY: "medium"
          OPENAI_IMAGE_SIZE: "1024x1792"
          OPENAI_TTS: "1"
          OPENAI_TTS_MODEL: "gpt-4o-mini-tts"
          OPENAI_TTS_VOICE: "cedar"
          V2_MARK_USED: "0"
          V2_MAX_AGE_HOURS: "96"
          SITE_URL: "https://spec-avtoportal.ru/"
          CONTENT_JSON_PATH: ${{ github.workspace }}/frontend/data/news.json
        run: |
          cd tools/autoposter
          python -m src.v2_main

      - name: Publish first YouTube Short
        env:
          SOCIAL_PLATFORMS: "youtube"
          SOCIAL_STRICT: "1"
          YOUTUBE_TOKEN_FILE: "youtube_token.json"
          YOUTUBE_PRIVACY: "public"
        run: |
          cd tools/autoposter
          python -m src.publish.social_v2

      - name: Commit social state
        if: success()
        run: |
          git config user.name "specavto-autoposter"
          git config user.email "actions@users.noreply.github.com"
          git add tools/autoposter/state/v2.json tools/autoposter/state/social_v2.json || true
          if git diff --cached --quiet; then
            echo "No social state changes"
            exit 0
          fi
          git commit -m "autoposter: record first YouTube Short v2"
          git pull --rebase origin main
          git push origin main

      - name: Upload generated preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-youtube-short-v2
          path: tools/autoposter/out_v2/*
          if-no-files-found: ignore
          retention-days: 7
