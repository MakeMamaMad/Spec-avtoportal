name: Control — Publish Pinned Schedule

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'tools/publish_control_schedule.py'
      - '.github/workflows/control_pinned_schedule.yml'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Send and pin schedule in SpecAvto Control
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          REPORT_TELEGRAM_CHAT_ID: ${{ secrets.REPORT_TELEGRAM_CHAT_ID }}
        run: |
          python tools/publish_control_schedule.py
