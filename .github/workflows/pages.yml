name: Pages

on:
  push:
    branches: [ main ]
    paths-ignore:
      - ".github/workflows/autoposter.yml"
      - "tools/autoposter/**"
      - "frontend/data/vk_state.json"


  # Запуск после успешного Ingest & Publish
  workflow_run:
    workflows: ["Ingest & Publish"]
    types: [completed]

  # Ручной запуск из Actions
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    # Для workflow_run запускаем только если Ingest & Publish прошёл успешно
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sanity check
        run: |
          test -f frontend/index.html || (echo "frontend/index.html not found" && exit 1)
          test -f tools/build_seo.py || (echo "tools/build_seo.py not found" && exit 1)

      - name: Install social card dependency
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install Pillow

      - name: Validate SEO builder syntax
        run: |
          python3 -m py_compile tools/build_seo.py
          node --check frontend/news.js
          node --check frontend/article.js

      - name: Build SEO article pages
        run: |
          python3 tools/build_seo.py
          test -f frontend/sitemap.xml || (echo "sitemap.xml not generated" && exit 1)
          test -f frontend/news-sitemap.xml || (echo "news-sitemap.xml not generated" && exit 1)
          test -f frontend/robots.txt || (echo "robots.txt not generated" && exit 1)
          test -f frontend/data/news-index.json || (echo "news-index.json not generated" && exit 1)
          test -f frontend/about.html || (echo "about.html not found" && exit 1)
          test -f frontend/yandex_1a6e631bb0fb2b04.html || (echo "Yandex verification file missing" && exit 1)
          grep -qx '    <body>Verification: 1a6e631bb0fb2b04</body>' frontend/yandex_1a6e631bb0fb2b04.html || (echo "Yandex verification file modified during build" && exit 1)
          ! grep -q 'metrika.js' frontend/yandex_1a6e631bb0fb2b04.html || (echo "Metrika leaked into Yandex verification file" && exit 1)
          test -f frontend/google503ab71f3bfbea30.html || (echo "Google verification file missing" && exit 1)
          grep -qx 'google-site-verification: google503ab71f3bfbea30.html' frontend/google503ab71f3bfbea30.html || (echo "Google verification file modified during build" && exit 1)
          ! grep -q 'metrika.js' frontend/google503ab71f3bfbea30.html || (echo "Metrika leaked into Google verification file" && exit 1)
          python3 - <<'PY'
          from pathlib import Path
          bad = []
          for path in Path("frontend").rglob("*.html"):
              if "\\n" in path.read_text(encoding="utf-8"):
                  bad.append(str(path))
          if bad:
              raise SystemExit("Literal \\n escape leaked into HTML: " + ", ".join(bad[:20]))
          PY
          grep -q 'SEO_NEWS_LIST_START --><article' frontend/index.html || (echo "homepage news was not pre-rendered" && exit 1)
          grep -q 'Sitemap: https://spec-avtoportal.ru/news-sitemap.xml' frontend/robots.txt || (echo "news sitemap missing from robots.txt" && exit 1)
          test -d frontend/social || (echo "social cards not generated" && exit 1)
          test "$(find frontend/social -maxdepth 1 -name '*.png' | wc -l)" -gt 0 || (echo "no social cards generated" && exit 1)

      - name: Upload static site (frontend)
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend  # публикуем содержимое папки frontend

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


  publish-vk:
    needs: deploy
    runs-on: ubuntu-latest
    concurrency:
      group: vk-publisher
      cancel-in-progress: false
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: aggregator/requirements.txt

      - name: Install publisher deps
        run: |
          python -m pip install --upgrade pip
          pip install -r aggregator/requirements.txt

      - name: Publish important VK items with site preview
        env:
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_MAX_POSTS: "3"
          SITE_URL: "https://spec-avtoportal.ru/"
        run: |
          python aggregator/post_to_vk.py --mode immediate

      - name: Commit VK state
        run: |
          git config user.name "specavto-vk"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/data/vk_state.json || true
          if git diff --cached --quiet; then
            echo "No VK state changes"
            exit 0
          fi
          git commit -m "vk: update editorial state"
          git push origin main
