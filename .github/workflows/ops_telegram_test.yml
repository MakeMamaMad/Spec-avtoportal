name: Control — Telegram Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/ops_telegram_test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Find recent admin channel and send test
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          if not token:
              raise SystemExit("TELEGRAM_BOT_TOKEN is missing")

          def call(method, payload=None):
              data = urllib.parse.urlencode(payload or {}).encode("utf-8")
              req = urllib.request.Request(
                  "https://api.telegram.org/bot" + token + "/" + method,
                  data=data,
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  body = json.loads(response.read().decode("utf-8"))
              if not body.get("ok"):
                  raise RuntimeError(body.get("description") or str(body))
              return body.get("result")

          webhook = call("getWebhookInfo") or {}
          if webhook.get("url"):
              raise SystemExit("Bot has an active webhook; automatic channel discovery is unavailable.")

          updates = call("getUpdates", {
              "timeout": 0,
              "limit": 100,
              "allowed_updates": json.dumps(["my_chat_member", "channel_post"])
          }) or []

          channels = []
          for update in updates:
              member = update.get("my_chat_member") or {}
              chat = member.get("chat") or {}
              if chat.get("type") == "channel":
                  channels.append((update.get("update_id", 0), chat))
              post = update.get("channel_post") or {}
              chat = post.get("chat") or {}
              if chat.get("type") == "channel":
                  channels.append((update.get("update_id", 0), chat))

          if not channels:
              raise SystemExit("No recent channel update found.")

          channels.sort(key=lambda item: item[0])
          matching = [
              item for item in channels
              if "control" in str(item[1].get("title") or "").lower()
          ]
          chat = (matching[-1] if matching else channels[-1])[1]

          call("sendMessage", {
              "chat_id": str(chat["id"]),
              "text": "✅ SpecAvto Control подключён.\n\nЭто тестовое сообщение от GitHub Actions. Канал готов принимать отчёты автоматизации.",
              "disable_web_page_preview": "true",
          })
          print("TEST_MESSAGE_SENT")
          PY
