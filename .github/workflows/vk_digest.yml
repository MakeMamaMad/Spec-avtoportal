name: VK Editorial Digest

on:
  workflow_dispatch:
  schedule:
    # 09:40 and 19:40 Moscow time
    - cron: '40 6 * * *'
    - cron: '40 16 * * *'

permissions:
  contents: write

concurrency:
  group: vk-publisher
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: aggregator/requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r aggregator/requirements.txt

      - name: Publish VK editorial digest
        env:
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_PHOTO_ACCESS_TOKEN: ${{ secrets.VK_PHOTO_ACCESS_TOKEN }}
          SITE_URL: "https://spec-avtoportal.ru/"
        run: |
          python aggregator/post_to_vk.py --mode digest

      - name: Commit VK state
        run: |
          git config user.name "specavto-vk"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/data/vk_state.json || true
          if git diff --cached --quiet; then
            echo "No VK state changes"
            exit 0
          fi
          git commit -m "vk: update editorial state"
          git push origin main
