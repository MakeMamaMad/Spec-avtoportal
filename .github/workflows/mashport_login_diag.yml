name: Diagnostics — MashPort Login

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/mashport_login_diag.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Check MashPort credentials and login
        env:
          MASHPORT_LOGIN: ${{ secrets.MASHPORT_LOGIN }}
          MASHPORT_PASSWORD: ${{ secrets.MASHPORT_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright

          login = os.environ.get("MASHPORT_LOGIN", "").strip()
          password = os.environ.get("MASHPORT_PASSWORD", "").strip()

          if not login or not password:
              print("MASHPORT_CREDENTIALS_MISSING")
              raise SystemExit(0)

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(locale="ru-RU")
              page.goto("https://www.mashport.ru/annonce/add_update", wait_until="domcontentloaded", timeout=60000)
              body = (page.locator("body").inner_text() or "").lower()

              if "необходимо войти в личный кабинет" not in body:
                  print("MASHPORT_LOGIN_OK already_authenticated")
                  browser.close()
                  raise SystemExit(0)

              text_inputs = page.locator('input[type="text"], input[type="email"], input[name*="login" i], input[name*="user" i]')
              pass_inputs = page.locator('input[type="password"]')
              if not text_inputs.count() or not pass_inputs.count():
                  print("MASHPORT_LOGIN_FORM_NOT_FOUND")
                  browser.close()
                  raise SystemExit(0)

              text_inputs.first.fill(login)
              pass_inputs.first.fill(password)

              submit = page.locator('button[type="submit"], input[type="submit"]')
              if not submit.count():
                  print("MASHPORT_LOGIN_SUBMIT_NOT_FOUND")
                  browser.close()
                  raise SystemExit(0)

              submit.first.click()
              try:
                  page.wait_for_load_state("domcontentloaded", timeout=30000)
              except Exception:
                  pass
              page.wait_for_timeout(1000)
              page.goto("https://www.mashport.ru/annonce/add_update", wait_until="domcontentloaded", timeout=60000)
              body = (page.locator("body").inner_text() or "").lower()
              if "необходимо войти в личный кабинет" in body:
                  print("MASHPORT_LOGIN_REJECTED")
              else:
                  print("MASHPORT_LOGIN_OK")
              browser.close()
          PY
