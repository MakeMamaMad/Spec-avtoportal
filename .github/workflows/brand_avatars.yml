name: Brand — Update Social Avatars

# Manual only: sets frontend/assets/avatar.png on the Telegram channel and VK community.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Update avatars
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
        run: python promotion/update_brand_avatars.py
      - name: Commit result
        if: always()
        run: |
          git config user.name "specavto-brand"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/data/promotion/brand_avatar_state.json || true
          git diff --cached --quiet && exit 0
          git commit -m "brand: record social avatar update"
          git pull --rebase origin main
          git push origin main
