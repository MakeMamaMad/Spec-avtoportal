name: Shorts v2 TTS Smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/shorts_v2_tts_smoke.yml"

permissions:
  contents: read

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/autoposter/requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate OpenAI Russian voice
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_TTS: "1"
          OPENAI_TTS_MODEL: "gpt-4o-mini-tts"
          OPENAI_TTS_VOICE: "cedar"
        run: |
          cd tools/autoposter
          python - <<'PY'
          from pathlib import Path
          from src.v2_main import generate_voice
          out = Path("/tmp/voice.mp3")
          mode = generate_voice(
              "СпецАвтоПортал. Коротко о рынке грузовой техники и прицепов.",
              out,
          )
          print("TTS_MODE=", mode)
          assert mode.startswith("openai:"), mode
          assert out.exists() and out.stat().st_size > 1000
          PY
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 /tmp/voice.mp3
