name: Control — Automation Reports

on:
  workflow_run:
    workflows:
      - "Video — Generate & Publish (YouTube + TikTok + Instagram)"
      - "Diagnostics — Buffer Channels"
      - "Diagnostics — Instagram Test Upload"
      - "Diagnostics — Buffer Post Status"
      - "Diagnostics — Buffer API Connection"
      - "Diagnostics — TikTok Test Upload"
      - "Maintenance — Cleanup Promotion Artifact"
      - "Control — Daily Summary"
      - "Telegram — Editorial Digest"
      - "Legacy — External Article Publisher"
      - "Checks — News Ingest Tests"
      - "News — Fetch & Publish"
      - "Control — Telegram Test"
      - "Site — Build, Deploy & VK Publish"
      - "Legacy — External Article Promotion Queue"
      - "Checks — Full QA"
      - "Maintenance — Safe Auto Merge"
      - "Video — Preview Generator"
      - "Promotion — Daily Site Advertising"
      - "Promotion — Prepare Telegram Ads"
      - "Promotion — Telegram Outreach"
      - "Promotion — Verify Placements"
      - "Promotion — Editorial Placement"
      - "Legacy — Verify MEXZONA Promotion"
      - "VK — Editorial Digest"
    types: [completed]

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: specavto-control-reports
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build report
        id: build
        run: |
          OUTPUT="$(python tools/build_ops_report.py)"
          echo "builder_output=$OUTPUT" >> "$GITHUB_OUTPUT"
          if [ "$OUTPUT" = "SKIP_REPORT" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post to SpecAvto Control issue
        if: steps.build.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment 77 --repo "${{ github.repository }}" --body-file /tmp/specavto-report.md

      - name: Send successful run summary to private Telegram channel
        if: steps.build.outputs.skip != 'true' && github.event.workflow_run.conclusion == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          REPORT_TELEGRAM_CHAT_ID: ${{ secrets.REPORT_TELEGRAM_CHAT_ID }}
        run: |
          python tools/send_ops_report_telegram.py

      - name: Remove duplicate Telegram morning digest
        if: github.event.workflow_run.conclusion == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          message_id = 1486

          data = urllib.parse.urlencode({
              "chat_id": chat_id,
              "message_id": str(message_id),
          }).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/deleteMessage",
              data=data,
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  body = json.loads(response.read().decode("utf-8"))
          except Exception as exc:
              print(f"Duplicate cleanup request failed: {exc}")
              raise

          if body.get("ok"):
              print(f"DUPLICATE_TELEGRAM_MESSAGE_DELETED={message_id}")
          else:
              description = str(body.get("description") or "")
              if "message to delete not found" in description.lower():
                  print(f"DUPLICATE_TELEGRAM_MESSAGE_ALREADY_GONE={message_id}")
              else:
                  raise RuntimeError(description or str(body))
          PY

      - name: Recover overdue news and social digests
        if: github.event.workflow_run.conclusion == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ACTIONS="$(python tools/social_schedule_watchdog.py | tail -n 1)"
          echo "Overdue social actions: ${ACTIONS:-none}"

          if echo " $ACTIONS " | grep -q " news "; then
            gh workflow run ingest.yml --ref main
            echo "Requested recovery: News — Fetch & Publish"
          fi
          if echo " $ACTIONS " | grep -q " telegram_am "; then
            gh workflow run daily_digest.yml --ref main
            echo "Requested recovery: Telegram morning digest"
          fi
          if echo " $ACTIONS " | grep -q " telegram_pm "; then
            gh workflow run daily_digest.yml --ref main
            echo "Requested recovery: Telegram evening digest"
          fi
          if echo " $ACTIONS " | grep -q " vk_am "; then
            gh workflow run vk_digest.yml --ref main
            echo "Requested recovery: VK morning digest"
          fi
          if echo " $ACTIONS " | grep -q " vk_pm "; then
            gh workflow run vk_digest.yml --ref main
            echo "Requested recovery: VK evening digest"
          fi
