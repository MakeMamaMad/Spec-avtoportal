name: Control — Automation Reports

on:
  workflow_run:
    workflows:
      - "Video — Generate & Publish (YouTube + TikTok + Instagram)"
      - "Diagnostics — Buffer Channels"
      - "Diagnostics — Instagram Test Upload"
      - "Diagnostics — Buffer Post Status"
      - "Diagnostics — Buffer API Connection"
      - "Diagnostics — TikTok Test Upload"
      - "Maintenance — Cleanup Promotion Artifact"
      - "Control — Daily Summary"
      - "Telegram — Editorial Digest"
      - "Legacy — External Article Publisher"
      - "Checks — News Ingest Tests"
      - "News — Fetch & Publish"
      - "Control — Telegram Test"
      - "Site — Build, Deploy & VK Publish"
      - "Legacy — External Article Promotion Queue"
      - "Checks — Full QA"
      - "Maintenance — Safe Auto Merge"
      - "Video — Preview Generator"
      - "Promotion — Daily Site Advertising"
      - "Promotion — Prepare Telegram Ads"
      - "Promotion — Telegram Outreach"
      - "Promotion — Verify Placements"
      - "Promotion — Editorial Placement"
      - "Legacy — Verify MEXZONA Promotion"
      - "VK — Editorial Digest"
    types: [completed]

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: specavto-control-reports
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build report
        id: build
        run: |
          OUTPUT="$(python tools/build_ops_report.py)"
          echo "builder_output=$OUTPUT" >> "$GITHUB_OUTPUT"
          if [ "$OUTPUT" = "SKIP_REPORT" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post to SpecAvto Control issue
        if: steps.build.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment 77 --repo "${{ github.repository }}" --body-file /tmp/specavto-report.md

      - name: Send successful run summary to private Telegram channel
        if: steps.build.outputs.skip != 'true' && github.event.workflow_run.conclusion == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          REPORT_TELEGRAM_CHAT_ID: ${{ secrets.REPORT_TELEGRAM_CHAT_ID }}
        run: |
          python tools/send_ops_report_telegram.py

      - name: Recover overdue news and social digests
        if: github.event.workflow_run.conclusion == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ACTIONS="$(python tools/social_schedule_watchdog.py | tail -n 1)"
          echo "Overdue social actions: ${ACTIONS:-none}"

          dispatch_if_idle() {
            WF="$1"
            LABEL="$2"
            ACTIVE="$(gh run list --workflow "$WF" --branch main --limit 10 --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "pending")] | length')"
            if [ "$ACTIVE" = "0" ]; then
              gh workflow run "$WF" --ref main
              echo "Requested recovery: $LABEL"
            else
              echo "$WF already active; skip duplicate recovery."
            fi
          }

          if echo " $ACTIONS " | grep -q " news "; then
            dispatch_if_idle "ingest.yml" "News — Fetch & Publish"
          fi
          if echo " $ACTIONS " | grep -q " telegram_am "; then
            dispatch_if_idle "daily_digest.yml" "Telegram morning digest"
          fi
          if echo " $ACTIONS " | grep -q " telegram_pm "; then
            dispatch_if_idle "daily_digest.yml" "Telegram evening digest"
          fi
          if echo " $ACTIONS " | grep -q " vk_am "; then
            dispatch_if_idle "vk_digest.yml" "VK morning digest"
          fi
          if echo " $ACTIONS " | grep -q " vk_pm "; then
            dispatch_if_idle "vk_digest.yml" "VK evening digest"
          fi

      - name: Ensure promotion recovery is running
        if: github.event.workflow_run.conclusion == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ACTION="$(python tools/promotion_schedule_watchdog.py | tail -n 1)"
          echo "Overdue promotion action: ${ACTION:-none}"
          if [ -z "$ACTION" ]; then
            exit 0
          fi

          ACTIVE="$(gh run list --workflow promotion_schedule_watchdog.yml --branch main --limit 10 --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "pending")] | length')"
          if [ "$ACTIVE" = "0" ]; then
            gh workflow run promotion_schedule_watchdog.yml --ref main
            echo "Requested Promotion — Schedule Watchdog"
          else
            echo "Promotion watchdog already active; skip duplicate dispatch."
          fi
