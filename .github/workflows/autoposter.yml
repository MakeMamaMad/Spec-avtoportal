name: autoposter-social-shorts-v2

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 2,4,6'  # 09:00 UTC = 12:00 МСК (Вт/Чт/Сб)

permissions:
  contents: write

concurrency:
  group: social-shorts-v2
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: tools/autoposter/requirements.txt

      - name: Install ffmpeg and fonts
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install deps
        shell: bash
        run: |
          pip install -r tools/autoposter/requirements.txt

      - name: Restore YouTube credentials
        shell: bash
        env:
          YT_CLIENT_B64: ${{ secrets.YOUTUBE_CLIENT_SECRETS_B64 }}
          YT_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
        run: |
          cd tools/autoposter
          if [ -n "$YT_CLIENT_B64" ]; then
            printf '%s' "$YT_CLIENT_B64" | base64 -d > client_secrets.json
          fi
          if [ -n "$YT_TOKEN_B64" ]; then
            printf '%s' "$YT_TOKEN_B64" | base64 -d > youtube_token.json
          fi

      - name: Generate AI Short v2
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_SCRIPT: "1"
          AI_IMAGES: "1"
          OPENAI_TEXT_MODEL: "gpt-5.6-luna"
          OPENAI_IMAGE_MODEL: "gpt-image-2.5-sunburst"
          OPENAI_IMAGE_QUALITY: "medium"
          OPENAI_IMAGE_SIZE: "1024x1792"
          OPENAI_TTS: "1"
          OPENAI_TTS_MODEL: "gpt-4o-mini-tts"
          OPENAI_TTS_VOICE: "cedar"
          V2_MARK_USED: "0"
          V2_MAX_AGE_HOURS: "96"
          SITE_URL: "https://spec-avtoportal.ru/"
          CONTENT_JSON_PATH: ${{ github.workspace }}/frontend/data/news.json
        run: |
          cd tools/autoposter
          python -m src.v2_main

      - name: Publish to YouTube Instagram TikTok
        shell: bash
        env:
          SOCIAL_PLATFORMS: "youtube,instagram,tiktok"
          SOCIAL_STRICT: "0"

          YOUTUBE_TOKEN_FILE: "youtube_token.json"
          YOUTUBE_CLIENT_SECRETS: "client_secrets.json"
          YOUTUBE_PRIVACY: "public"

          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_IG_USER_ID: ${{ secrets.INSTAGRAM_IG_USER_ID }}
          INSTAGRAM_API_VERSION: "v26.0"
          INSTAGRAM_GRAPH_BASE: "https://graph.facebook.com"
          INSTAGRAM_SHARE_TO_FEED: "1"

          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
        run: |
          cd tools/autoposter
          python -m src.publish.social_v2

      - name: Commit social state
        if: always()
        shell: bash
        run: |
          git config user.name "specavto-autoposter"
          git config user.email "actions@users.noreply.github.com"
          git add tools/autoposter/state/v2.json tools/autoposter/state/social_v2.json || true
          if git diff --cached --quiet; then
            echo "No social state changes"
            exit 0
          fi
          git commit -m "autoposter: update social v2 state"
          git pull --rebase origin main
          git push origin main

      - name: Upload preview artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: social-shorts-v2-output
          path: tools/autoposter/out_v2/*
          if-no-files-found: ignore
          retention-days: 7
