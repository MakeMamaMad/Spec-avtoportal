name: Shorts v2 Clean Preview

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/shorts_v2_clean_smoke.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: tools/autoposter/requirements.txt

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install -r tools/autoposter/requirements.txt

      - name: Render clean AI preview
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_SCRIPT: "1"
          AI_IMAGES: "1"
          OPENAI_TEXT_MODEL: "gpt-5.6-luna"
          OPENAI_IMAGE_MODEL: "gpt-image-2.5-sunburst"
          OPENAI_IMAGE_QUALITY: "medium"
          OPENAI_IMAGE_SIZE: "1024x1792"
          OPENAI_TTS: "1"
          OPENAI_TTS_MODEL: "gpt-4o-mini-tts"
          OPENAI_TTS_VOICE: "cedar"
          V2_MARK_USED: "0"
          SITE_URL: "https://spec-avtoportal.ru/"
          CONTENT_JSON_PATH: ${{ github.workspace }}/frontend/data/news.json
        run: |
          cd tools/autoposter
          python -m src.v2_main

      - name: Validate clean output
        run: |
          test -s tools/autoposter/out_v2/master.mp4
          test ! -e tools/autoposter/tmp_v2/render/subtitles.ass
          ffprobe -v error -show_entries stream=width,height -show_entries format=duration \
            -of default=noprint_wrappers=1 tools/autoposter/out_v2/master.mp4
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path("tools/autoposter/out_v2/manifest.json").read_text("utf-8"))
          assert str(m["tts"]).startswith("openai:"), m["tts"]
          assert all(x == "ai" for x in m["visual_modes"]), m["visual_modes"]
          print("CLEAN_PREVIEW_OK", m["title"], m["tts"], m["render"]["video_seconds"])
          PY

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: shorts-v2-clean-preview
          path: tools/autoposter/out_v2/*
          retention-days: 7
