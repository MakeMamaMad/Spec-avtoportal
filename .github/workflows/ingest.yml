name: Ingest & Publish

on:
  workflow_dispatch:
  schedule:
    # при желании поправишь расписание
    - cron: '0 */3 * * *'
  push:
    branches: [ main ]
    paths:
      - 'aggregator/**'
      - '.github/workflows/ingest.yml'

permissions:
  contents: write

concurrency:
  group: telegram-publisher
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            aggregator/requirements.txt
            aggregator/translate-requirements.txt

      - name: Install deps if present
        run: |
          python -m pip install --upgrade pip

          # основной requirements агрегатора
          if [ -f "aggregator/requirements.txt" ]; then
            pip install -r aggregator/requirements.txt
          fi

          # Translation dependencies are installed only when new foreign
          # items actually need translation.

      - name: Quick YAML check (aggregator/sources.yml)
        run: |
          python - << 'PY'
          import sys, pathlib, yaml

          path = pathlib.Path("aggregator/sources.yml")
          data = yaml.safe_load(path.read_text(encoding="utf-8"))

          if not isinstance(data, dict):
              print("sources.yml must be a mapping with top-level key 'sources'", file=sys.stderr)
              sys.exit(1)

          sources = data.get("sources")
          if not isinstance(sources, list):
              print("sources.yml: 'sources' must be a list", file=sys.stderr)
              sys.exit(1)

          print(f"OK: {len(sources)} sources configured.")
          PY

      - name: Run aggregator
        run: |
          python -m aggregator.run \
            --sources aggregator/sources.yml \
            --output frontend/data/news.json

      - name: Restore Argos language models
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/argos-translate
            ~/.cache/argos-translate
          key: argos-models-${{ runner.os }}-py311-v1
          restore-keys: |
            argos-models-${{ runner.os }}-py311-

      - name: Translate only new foreign items
        env:
          NEWS_PATH: frontend/data/news.json
        run: |
          if [ ! -f "aggregator/translate_news.py" ]; then
            echo "No translate script found at aggregator/translate_news.py — skipping translation."
            exit 0
          fi

          NEEDS_TRANSLATION="$(python aggregator/translate_news.py --count)"
          echo "Items requiring translation: $NEEDS_TRANSLATION"

          if [ "$NEEDS_TRANSLATION" = "0" ]; then
            echo "No new foreign items. Skipping Argos dependency/model startup."
            exit 0
          fi

          python -m pip install -q -r aggregator/translate-requirements.txt
          python aggregator/translate_news.py

      - name: Assign stable SEO ids and slugs
        run: |
          python tools/build_seo.py --metadata-only

      - name: Preview output
        run: |
          ls -R
          ls -l frontend/data || true
          echo "===== head of news.json ====="
          head -c 4000 frontend/data/news.json || true
          echo
          echo "============================="

      - name: Post new items to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MAX_POSTS: "3"       # only high-priority stories; ordinary items wait for digest
        run: |
          python aggregator/post_to_telegram.py || echo "Telegram publishing failed; state/news changes will still be committed for safe retry"

      - name: Commit & push changes
        env:
          GIT_AUTHOR_NAME: github-actions
          GIT_AUTHOR_EMAIL: actions@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions
          GIT_COMMITTER_EMAIL: actions@users.noreply.github.com
        run: |
          git status

          # Добавляем ВСЕ json из frontend/data (news.json, news_meta.json и т.д.)
          git add frontend/data/*.json || true

          # Если после add нет изменений — просто выходим
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update data json (automated ingest + translation)"
          git push origin main
