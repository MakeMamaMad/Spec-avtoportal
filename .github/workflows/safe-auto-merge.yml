name: Maintenance — Safe Auto Merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: safe-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  merge:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for required checks and merge owner PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPOSITORY"]

          with open(os.environ["GITHUB_EVENT_PATH"], "r", encoding="utf-8") as fh:
              event = json.load(fh)

          event_pr = event.get("pull_request") or {}
          pr_number = int(event_pr.get("number") or 0)
          event_head_sha = ((event_pr.get("head") or {}).get("sha") or "")
          if not pr_number or not event_head_sha:
              print("No pull request context; skipping.")
              raise SystemExit(0)

          api_root = f"https://api.github.com/repos/{repo}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "spec-avtoportal-auto-merge",
          }

          def request(path, method="GET", payload=None):
              data = json.dumps(payload).encode("utf-8") if payload is not None else None
              req = urllib.request.Request(
                  api_root + path,
                  data=data,
                  method=method,
                  headers=headers,
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  body = resp.read().decode("utf-8")
                  return json.loads(body) if body else {}

          def current_pr():
              return request(f"/pulls/{pr_number}")

          pr = current_pr()
          if pr.get("state") != "open" or pr.get("draft"):
              print("PR is not an open non-draft PR; skipping.")
              raise SystemExit(0)
          if (pr.get("base") or {}).get("ref") != "main":
              print("PR does not target main; skipping.")
              raise SystemExit(0)

          head_repo = (((pr.get("head") or {}).get("repo") or {}).get("full_name") or "")
          owner_login = ((((pr.get("base") or {}).get("repo") or {}).get("owner") or {}).get("login") or "")
          author_login = ((pr.get("user") or {}).get("login") or "")
          if head_repo != repo or author_login != owner_login:
              print("Only same-repository PRs opened by the repository owner are auto-merged.")
              raise SystemExit(0)

          files = request(f"/pulls/{pr_number}/files?per_page=100")
          filenames = [str(item.get("filename") or "") for item in files]
          needs_ingest_tests = any(
              name.startswith("aggregator/")
              or name == "main.py"
              or name == ".github/workflows/ingest-tests.yml"
              for name in filenames
          )

          required = {"Checks — Full QA"}
          if needs_ingest_tests:
              required.add("Checks — News Ingest Tests")

          print("Required checks:", ", ".join(sorted(required)))

          max_attempts = 80
          for attempt in range(1, max_attempts + 1):
              pr = current_pr()
              if pr.get("state") != "open" or pr.get("draft"):
                  print("PR closed or became draft; stopping.")
                  raise SystemExit(0)

              head_sha = ((pr.get("head") or {}).get("sha") or "")
              if head_sha != event_head_sha:
                  print("PR head changed; a newer auto-merge run will handle it.")
                  raise SystemExit(0)

              query = urllib.parse.urlencode({
                  "head_sha": head_sha,
                  "event": "pull_request",
                  "per_page": 100,
              })
              runs = request(f"/actions/runs?{query}").get("workflow_runs") or []

              latest = {}
              for run in runs:
                  name = str(run.get("name") or "")
                  if name not in required:
                      continue
                  current = latest.get(name)
                  if current is None or int(run.get("run_number") or 0) > int(current.get("run_number") or 0):
                      latest[name] = run

              waiting = []
              for name in sorted(required):
                  run = latest.get(name)
                  if not run:
                      waiting.append(f"{name}: not started")
                      continue
                  if run.get("status") != "completed":
                      waiting.append(f"{name}: {run.get('status')}")
                      continue
                  if run.get("conclusion") != "success":
                      raise SystemExit(
                          f"Required workflow {name!r} concluded {run.get('conclusion')}; refusing auto-merge."
                      )

              if not waiting:
                  print("All required checks passed.")
                  break

              print(f"Waiting ({attempt}/{max_attempts}): " + "; ".join(waiting))
              time.sleep(15)
          else:
              raise SystemExit("Timed out waiting for required checks.")

          try:
              result = request(
                  f"/pulls/{pr_number}/merge",
                  method="PUT",
                  payload={
                      "merge_method": "squash",
                      "sha": event_head_sha,
                  },
              )
          except urllib.error.HTTPError as exc:
              detail = exc.read().decode("utf-8", errors="replace")
              raise SystemExit(f"Merge request failed: HTTP {exc.code}: {detail}")

          if not result.get("merged"):
              raise SystemExit(f"Merge was not completed: {result}")

          print(f"PR #{pr_number} merged automatically at {result.get('sha')}.")
          PY
