name: First External Promotion

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'promotion/publish_truckmix.py'
      - '.github/workflows/first_external_promotion.yml'

permissions:
  contents: write

concurrency:
  group: first-external-promotion
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Build promotion queue
        run: |
          python promotion/agent.py

      - name: Publish first external item to TRUCKmix
        env:
          PROMOTION_LIVE: "1"
          TRUCKMIX_LOGIN: ${{ secrets.TRUCKMIX_LOGIN }}
          TRUCKMIX_PASSWORD: ${{ secrets.TRUCKMIX_PASSWORD }}
        run: |
          python promotion/publish_truckmix.py

      - name: Commit successful publication state
        if: success()
        run: |
          git config user.name "specavto-promotion"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/data/promotion_queue.json frontend/data/promotion_history.json promotion/first_launch_done.json || true
          if git diff --cached --quiet; then
            echo "No promotion state changes"
            exit 0
          fi
          git commit -m "promotion: record first external publication"
          git push origin main

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-external-promotion-diagnostics
          path: promotion/artifacts/*
          if-no-files-found: ignore
