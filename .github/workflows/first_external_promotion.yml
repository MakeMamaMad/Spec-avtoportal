name: First External Promotion

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'promotion/publish_mexzona.py'
      - '.github/workflows/first_external_promotion.yml'

permissions:
  contents: write

concurrency:
  group: first-external-promotion
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Build promotion queue
        run: |
          python promotion/agent.py

      - name: Publish first external item to MEXZONA
        env:
          PROMOTION_LIVE: "1"
          MEXZONA_LOGIN: ${{ secrets.MEXZONA_LOGIN }}
          MEXZONA_PASSWORD: ${{ secrets.MEXZONA_PASSWORD }}
        run: |
          python promotion/publish_mexzona.py

      - name: Commit successful publication state
        if: success()
        run: |
          git config user.name "specavto-promotion"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/data/promotion_queue.json frontend/data/promotion_history.json promotion/first_launch_done.json || true
          if git diff --cached --quiet; then
            echo "No promotion state changes"
            exit 0
          fi
          git commit -m "promotion: record first external publication"
          git push origin main
