name: Promotion — Gmail Delivery Check
# recheck gmail readonly token

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'promotion/check_gmail_bounces.py'
      - '.github/workflows/gmail_delivery_check.yml'
  schedule:
    # Check hourly; delivery failures often arrive after the send workflow has finished.
    - cron: '43 * * * *'

permissions:
  contents: write

concurrency:
  group: promotion-gmail-delivery-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Gmail auth dependency
        run: |
          python -m pip install --upgrade pip
          pip install google-auth requests

      - name: Restore Gmail credentials
        env:
          GMAIL_TOKEN_B64: ${{ secrets.GMAIL_TOKEN_B64 }}
        run: |
          if [ -z "$GMAIL_TOKEN_B64" ]; then
            echo "GMAIL_AUTOMATION_NOT_CONFIGURED"
            exit 0
          fi
          printf '%s' "$GMAIL_TOKEN_B64" | base64 -d > gmail_token.json
          test -s gmail_token.json

      - name: Detect delivery failures
        env:
          GMAIL_TOKEN_FILE: gmail_token.json
        run: |
          python promotion/check_gmail_bounces.py

      - name: Commit delivery state
        if: always()
        run: |
          git config user.name "specavto-promotion"
          git config user.email "actions@users.noreply.github.com"
          git add             frontend/data/promotion/editorial_history.json             frontend/data/promotion/manual_queue.json             frontend/data/promotion/editorial_summary.json             frontend/data/promotion/gmail_delivery_state.json             promotion/targets.json || true
          if git diff --cached --quiet; then
            echo "No Gmail delivery state changes"
            exit 0
          fi
          git commit -m "promotion: update Gmail delivery status"
          git pull --rebase origin main
          git push origin main
